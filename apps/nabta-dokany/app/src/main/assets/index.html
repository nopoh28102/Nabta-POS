<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087f5b"><title>نبتة دكاني</title>
  <style>
    .receive-hero{background:linear-gradient(135deg,#0e754f,#15946b);color:#fff;border:0}.receive-hero .sub{color:#e5fff4}.receipt-number{font:700 11px ui-monospace,monospace;background:#ffffff24;border-radius:9px;padding:5px 7px}.receive-scan{background:#edfff5;border:1px solid #9fdcc0;color:#08734a}.receive-scan .small{color:#28755b}.receive-line{border-radius:18px;padding:13px}.receive-line-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.receive-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:11px 0 9px;border:1px solid #e2edf2;border-radius:12px;overflow:hidden}.receive-stat{background:#fbfdff;text-align:center;padding:7px 3px}.receive-stat small{display:block;color:#637c8c;font-size:10px}.receive-stat b{display:block;margin-top:3px;font-size:13px}.entry-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.entry-buttons button{min-height:38px;border-radius:10px;border:1px solid #c9e7d7;background:#f4fbf7;color:#18754f;font-weight:900;font:inherit;padding:4px}.entry-buttons button.active{background:#0c8155;color:#fff;border-color:#0c8155}.packing-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.packing-grid .wide{grid-column:1/-1}.receipt-summary{background:#ecf8f1;border:1px solid #ccead9;border-radius:16px;padding:12px;color:#076e48}.barcode-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.barcode-actions button{min-height:38px}.mode-help{font-size:11px;color:#627a88;margin-top:6px}.new-product-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.new-product-title .tag{white-space:nowrap}@media(max-width:390px){.entry-buttons{grid-template-columns:repeat(2,1fr)}.packing-grid{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.receive-stats{grid-template-columns:repeat(2,1fr)}}
    :root{--p:#1565c0;--deep:#172b42;--blue:#2196f3;--bg:#f4f9fd;--green:#12734f;--red:#c92b37;--border:#d8e6f1;--muted:#72879a;--card:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--deep);font:14px Tahoma,"Segoe UI",Arial,sans-serif;padding-bottom:92px}.top{height:76px;background:linear-gradient(120deg,#1565c0,#2376cf);color:white;display:flex;align-items:center;justify-content:space-between;padding:22px 16px 10px;box-shadow:0 3px 12px #0c4e9433;position:sticky;top:0;z-index:10}.brand{font-size:19px;font-weight:900}.top button{border:0;background:#ffffff22;color:white;border-radius:14px;min-width:44px;min-height:42px;padding:8px 10px;font-weight:800}.wrap{max-width:640px;margin:auto;padding:14px 12px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:0 2px 8px #16395c10;margin-bottom:11px}.title{font-weight:900;font-size:17px;margin-bottom:8px}.sub{color:var(--muted);font-size:12px;line-height:1.65}.grid{display:grid;gap:9px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:11px;color:#536c80;font-weight:800;margin:0 2px 4px}input,select{width:100%;border:1px solid #cfe3f5;border-radius:13px;padding:11px;background:#fcfeff;color:var(--deep);font:inherit}input:focus,select:focus{outline:2px solid #1565c055}.btn{border:0;border-radius:13px;min-height:44px;padding:10px 12px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--p);color:white}.green{background:var(--green);color:white}.outline{background:white;color:var(--p);border:1px solid var(--p)}.muted{background:#eaf2f9;color:#466277}.danger{color:var(--red);background:#fff0f1}.full{width:100%}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1}.notice{border-radius:13px;padding:11px 12px;font-weight:800;margin:0 0 10px}.notice.ok{background:#e8f7f0;color:#126447}.notice.err{background:#fff0f1;color:#aa2532}.notice.warn{background:#fff8dc;color:#806010}.metric{background:#f6fbff;border-radius:14px;text-align:center;padding:11px 4px}.metric b{display:block;color:var(--p);font-size:17px;margin-top:2px}.scan{border:1px dashed #7ab7ec;background:#f1f9ff;border-radius:16px;padding:17px;text-align:center;font-weight:900;color:var(--p);cursor:pointer}.line{border:1px solid var(--border);border-radius:15px;padding:12px;margin-top:9px}.line .name{font-weight:900}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.chip{font-size:11px;background:#e9f6ef;color:#167453;border:1px solid #c7e9d7;border-radius:9px;padding:5px 8px;font-weight:800}.price{font-weight:900;color:#106a4b}.bottom{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--border);box-shadow:0 -4px 16px #123b5e12;z-index:10;padding-bottom:max(0px,env(safe-area-inset-bottom))}.nav{max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);min-height:72px}.nav button{border:0;background:transparent;padding:7px 1px 6px;color:#7690a4;font:800 10px Tahoma;cursor:pointer;display:grid;place-items:center;gap:2px}.nav button.active{color:var(--p)}.nav svg{width:23px;height:23px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.nav button.active svg{stroke-width:2.5}.nav span{display:block;white-space:nowrap}.hidden{display:none!important}.empty{text-align:center;padding:28px 8px;color:var(--muted)}.total{background:#edf9f2;border-radius:13px;padding:11px;font-weight:900;color:#0c6848}.small{font-size:11px}.login{min-height:calc(100vh - 76px);display:flex;align-items:center}.logo{font-size:38px;text-align:center}.tag{background:#eaf3fc;border-radius:999px;color:var(--p);font-size:11px;font-weight:900;padding:6px 10px;display:inline-block}.loading{opacity:.65;pointer-events:none}.hr{border:0;border-top:1px dashed var(--border);margin:12px 0}.shortcut{border:1px solid var(--border);border-radius:17px;background:#fff;padding:14px;text-align:right;min-height:105px}.shortcut .shortcut-icon{color:var(--p);margin-bottom:8px}.shortcut svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
</head>
<body>
  <header class="top"><button onclick="openNav()" aria-label="القائمة">☰</button><div class="brand">نبتة <span style="opacity:.78;font-size:13px">للمتجر</span></div><button onclick="go('settings')" aria-label="الإعدادات">⚙</button></header>
  <main class="wrap" id="root"></main>
  <footer class="bottom"><div class="nav" style="grid-template-columns:repeat(6,1fr)">
    <button data-nav="home" onclick="go('home')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg><span>الرئيسية</span></button>
    <button data-nav="products" onclick="go('products')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7 12 3l8 4v11l-8 4-8-4z"/><path d="m4 7 8 4 8-4M12 11v11"/></svg><span>المخزون</span></button>
    <button data-nav="sale" onclick="go('sale')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2 11h10l3-8H8"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span>البيع</span></button>
    <button data-nav="customers" onclick="go('customers')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg><span>الديون</span></button>
    <button data-nav="reports" onclick="go('reports')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h17"/><path d="M8 16v-5M13 16V7M18 16v-9"/></svg><span>التقارير</span></button>
    <button data-nav="settings" onclick="go('settings')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1A7 7 0 0 0 14.5 5L14 2h-4l-.5 3a7 7 0 0 0-2.1 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1A7 7 0 0 0 9.5 19l.5 3h4l.5-3a7 7 0 0 0 2.1-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg><span>المزيد</span></button>
  </div></footer>
<script>
const S={screen:'home',session:null,products:[],lines:[],saleLines:[],supplier:'',invoiceNo:'',suppliers:[],selectedExpiry:null,notice:null,inlineNew:false,shift:null,report:null,customers:[],saleCustomerId:'',invoices:[],selectedSale:null,stocktake:null,productDetail:null,scanActive:false,pendingBarcode:'',printSale:true};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>`${(Number(n||0)/100).toLocaleString('ar-EG',{minimumFractionDigits:2})} ج`;
const native=(method,...args)=>new Promise((resolve,reject)=>{const id='n'+Date.now()+Math.random().toString(16).slice(2);S.callbacks[id]={resolve,reject};try{window.NabtaAndroid[method](id,...args)}catch(e){delete S.callbacks[id];reject(e)}});
const command=(method,path,body)=>native('command',method,path,body===undefined?'':JSON.stringify(body));
S.callbacks={};window.NabtaNative={onNativeResult:(id,text)=>{const c=S.callbacks[id];delete S.callbacks[id];if(!c)return;try{const out=JSON.parse(text);out.ok?c.resolve(out.data):c.reject(new Error(out.message||'تعذر تنفيذ العملية'))}catch(e){c.reject(e)}}};
function flash(message,type='ok'){S.notice={message,type};render();setTimeout(()=>{S.notice=null;render()},4200)}
function view(html){document.querySelector('#root').innerHTML=(S.notice?`<div class="notice ${S.notice.type}">${esc(S.notice.message)}</div>`:'')+html;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===S.screen))}
function go(screen){S.screen=screen;render();if(screen==='receive')loadSuppliers();if(screen==='sale'||screen==='expense')loadShift();if(screen==='sale'||screen==='customers')loadCustomers(false);if(screen==='stocktake')loadStocktake()}
function render(){if(!S.session)return loginView();({home:homeView,receive:receiveView,sale:saleView,products:productsView,productDetail:productDetailView,weight:weightView,expiry:expiryView,reports:reportsView,customers:customersView,expense:expenseView,invoices:invoicesView,stocktake:stocktakeView,settings:settingsView}[S.screen]||homeView)()}
function loginView(){view(`<section class="login"><div class="card full"><div class="logo">🌱</div><div class="title" style="text-align:center">نبتة دكاني</div><p class="sub" style="text-align:center">واجهة متجر عربية سريعة، متصلة بنبتة بأمان.</p><div class="grid"><div><label>رابط بوابة نبتة</label><input id="url" value="https://nabta-inventory-scanner-relay.mahmoudnabih989.workers.dev"></div><div><label>رقم الكاشير</label><input id="terminal" placeholder="رقم نقطة البيع"></div><div class="g2 grid"><div><label>اسم المستخدم</label><input id="user"></div><div><label>كلمة المرور</label><input id="pass" type="password"></div></div><button class="btn primary full" onclick="login()">تسجيل الدخول إلى نبتة</button></div><p class="sub" style="margin-bottom:0">لا تحفظ الصفحة كلمة المرور ولا يصل إليها HTML؛ الاتصال يتم من طبقة Android الآمنة.</p></div></section>`)}
function homeView(){view(`<div class="card"><div class="row between"><div><div class="title">مرحبًا ${esc(S.session.displayName||'بك')}</div><div class="sub">متجر نبتة متصل • الكاشير ${esc(S.session.terminalId)}</div></div><span class="tag">متصل</span></div></div><div class="grid g3"><div class="metric"><small>فاتورة الاستلام</small><b>${S.lines.length}</b></div><div class="metric"><small>إجماليها</small><b>${money(total())}</b></div><div class="metric"><small>نتائج البحث</small><b>${S.products.length}</b></div></div><div class="grid g2" style="margin-top:11px"><button class="shortcut" onclick="go('sale')"><div class="shortcut-icon">⌑</div><b>بيع سريع</b><div class="sub">سلة وخصم وفاتورة</div></button><button class="shortcut" onclick="go('receive')"><div class="shortcut-icon">▣</div><b>استلام المورد</b><div class="sub">فاتورة، كرتون وصلاحية</div></button><button class="shortcut" onclick="go('products')"><div class="shortcut-icon">⌕</div><b>المخزون والأصناف</b><div class="sub">بحث وباركود وصنف جديد</div></button><button class="shortcut" onclick="go('expiry')"><div class="shortcut-icon">◷</div><b>تسجيل الصلاحية</b><div class="sub">بدون تغيير الرصيد</div></button><button class="shortcut" onclick="scanForReceive()"><div class="shortcut-icon">▥</div><b>مسح متتابع</b><div class="sub">إضافة سريعة للفاتورة</div></button></div><div class="card" style="margin-top:11px"><div class="title">الفواتير والطباعة</div><div class="sub">عند اعتماد فاتورة الاستلام يرحّلها نبتة مرة واحدة ويرسل طلب طباعة واحد إلى XPrinter على جهاز نبتة الرئيسي.</div></div>`)}
function saleView(){const open=S.shift?.id;view(`<div class="card"><div class="row between"><div><div class="title">بيع وإصدار فاتورة</div><div class="sub">${open?'وردية مفتوحة: '+esc(S.shift.id.slice(0,8)):'يلزم وجود وردية مفتوحة على نقطة البيع'}</div></div><span class="tag">${open?'جاهز للبيع':'تحقق من الوردية'}</span></div></div><div class="card"><div class="scan" onclick="scanForSale()">▥ مسح باركود للبيع</div><div class="row" style="margin-top:8px"><input id="sq" class="grow" placeholder="اسم المنتج أو الباركود"><button class="btn primary" onclick="searchSale()">بحث</button></div><div id="saleResults"></div></div><div class="card"><div class="row between"><div class="title">سلة البيع (${S.saleLines.length})</div><button class="btn danger" onclick="S.saleLines=[];render()">مسح السلة</button></div>${S.saleLines.length?S.saleLines.map(saleLineCard).join(''):'<div class="empty">السلة فارغة</div>'}</div>${S.saleLines.length?`<div class="card"><div class="g2 grid"><div><label>خصم الفاتورة</label><input id="discount" value="0" type="number" min="0" step=".01" oninput="renderSaleTotal()"></div><div><label>طريقة الدفع</label><select id="payment"><option value="CASH">نقدي</option><option value="CREDIT">آجل / دين عميل</option><option value="CARD">بطاقة</option></select></div></div><div class="total" id="saleTotal">إجمالي البيع: ${money(saleTotal())}</div><button class="btn green full" style="margin-top:9px" onclick="postSale()">✓ إتمام البيع وطباعة الإيصال</button></div>`:''}`)}
function saleLineCard(l,i){return `<div class="line"><div class="row between"><div><b>${esc(l.product.nameAr)}</b><div class="sub">${money(l.product.priceMinor)} للوحدة</div></div><button class="btn danger" onclick="S.saleLines.splice(${i},1);render()">🗑</button></div><div class="row" style="margin-top:8px"><label class="grow">الكمية <input type="number" min="1" value="${l.qty}" onchange="S.saleLines[${i}].qty=Math.max(1,Number(this.value)||1);render()"></label><b>${money(l.qty*l.product.priceMinor)}</b></div></div>`}
function receiveView(){view(`<div class="card"><div class="title">استلام سريع من المورد</div><div class="grid g2"><div><label>المورد</label><input id="supplier" list="suppliers" value="${esc(S.supplier)}" oninput="S.supplier=this.value"><datalist id="suppliers">${S.suppliers.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></div><div><label>رقم فاتورة المورد (اختياري)</label><input id="invoice" value="${esc(S.invoiceNo)}" oninput="S.invoiceNo=this.value"></div></div><button class="btn outline full" style="margin-top:8px" onclick="newSupplier()">+ إضافة مورد جديد</button></div><div class="card"><div class="title">إضافة صنف</div><div class="scan" onclick="scanForReceive()">▥ مسح باركود<br><span class="small">امسح صنفًا ثم تابع مسح الأصناف التالية بسرعة</span></div><div class="row" style="margin-top:8px"><input id="q" class="grow" placeholder="اسم المنتج أو الباركود"><button class="btn primary" onclick="searchProducts()">بحث</button></div><div id="results"></div><button class="btn muted full" style="margin-top:9px" onclick="S.inlineNew=!S.inlineNew;render()">${S.inlineNew?'إغلاق نموذج الصنف':'＋ صنف جديد داخل الفاتورة'}</button>${S.inlineNew?inlineProductForm():''}</div><div class="card"><div class="row between"><div class="title">المنتجات المضافة (${S.lines.length})</div><button class="btn muted" onclick="scanForReceive()">▥ مسح التالي</button></div>${S.lines.length?S.lines.map(lineCard).join(''):'<div class="empty">🧾<p>امسح أو ابحث عن صنف لإضافته للفواتير</p></div>'}</div>${S.lines.length?`<div class="total">إجمالي الشراء: ${money(total())}<br><span class="small">سيتم طباعة إيصال الاستلام على جهاز نبتة الرئيسي بعد الاعتماد.</span></div><button class="btn green full" style="margin-top:9px" onclick="confirmReceipt()">✓ اعتماد وإرسال إلى نبتة</button>`:''}`)}
function inlineProductForm(){return `<div class="line"><div class="title">صنف جديد داخل الفاتورة</div><div class="grid"><div><label>اسم الصنف</label><input id="ipn" placeholder="اسم المنتج"></div><div class="g2 grid"><div><label>التصنيف</label><input id="ipc" value="عام"></div><div><label>نوع الوحدة</label><select id="ipu"><option value="PIECE">قطعة</option><option value="WEIGHT">كيلو / وزن</option></select></div></div><div class="g3 grid"><div><label>باركود القطعة</label><input id="ipb" value="${esc(S.pendingBarcode||'')}" placeholder="تلقائي"></div><div><label>باركود الكيس</label><input id="ipkb" placeholder="اختياري"></div><div><label>باركود الكرتونة</label><input id="ipcb" placeholder="تلقائي مع الكرتونة"></div></div><div class="g2 grid"><div><label>سعر شراء القطعة</label><input id="ipco" type="number" min="0" step=".01"></div><div><label>سعر بيع القطعة</label><input id="ips" type="number" min=".01" step=".01"></div></div><div><label>قطع الكرتونة (1 إذا لم توجد)</label><input id="ipp" type="number" min="1" value="1"></div><button class="btn green full" onclick="createInlineProduct()">إنشاء وإضافته للفاتورة</button></div></div>`}
function lineCard(l,i){const carton=l.product.purchasePackSize>1;const qty=l.carton?l.qty*l.product.purchasePackSize:l.qty;return `<div class="line"><div class="row between"><div><div class="name">${esc(l.product.nameAr)}</div><div class="sub">${esc(l.product.barcodes?.[0]||'باركود تلقائي')}</div></div><button class="btn danger" onclick="removeLine(${i})">🗑</button></div><div class="chips"><span class="chip">${carton?'كرتونة × '+l.product.purchasePackSize:'قطعة'}</span><span class="chip">الكمية: ${qty}</span><span class="chip">بيع: ${money(l.sell)}</span></div><div class="grid g3"><div><label>${carton?'كراتين':'قطع'}</label><input type="number" min="1" value="${l.qty}" onchange="editLine(${i},'qty',this.value)"></div><div><label>${carton?'شراء الكرتونة':'شراء القطعة'}</label><input type="number" min="0" value="${(l.cost/100).toFixed(2)}" onchange="editLine(${i},'cost',this.value)"></div><div><label>بيع القطعة</label><input type="number" min=".01" value="${(l.sell/100).toFixed(2)}" onchange="editLine(${i},'sell',this.value)"></div></div><div class="grid g2" style="margin-top:7px"><div><label>صلاحية (اختياري)</label><input type="date" value="${l.expiry||''}" onchange="editLine(${i},'expiry',this.value)"></div><div><label>طريقة الإدخال</label><select onchange="editLine(${i},'carton',this.value)">${carton?`<option value="true" ${l.carton?'selected':''}>كرتونة</option><option value="false" ${!l.carton?'selected':''}>فرط</option>`:'<option value="false">قطع</option>'}</select></div></div><div class="price" style="margin-top:7px">إجمالي السطر: ${money(lineTotal(l))}</div></div>`}
function productsView(){view(`<div class="card"><div class="title">الأصناف والباركود</div><div class="row"><input id="pq" class="grow" placeholder="اسم المنتج أو الباركود"><button class="btn primary" onclick="searchProducts('pq','productResults')">بحث</button><button class="btn muted" onclick="scanSearch('pq','productResults')">▥</button></div><div id="productResults"></div></div><div class="card"><div class="title">إضافة صنف جديد</div><div class="grid"><div><label>اسم الصنف</label><input id="pn" placeholder="مثال: بسكويت شوكولاتة"></div><div class="g2 grid"><div><label>التصنيف</label><input id="pc" value="عام"></div><div><label>باركود القطعة (اختياري)</label><input id="pb" placeholder="يُولد تلقائيًا"></div></div><div class="g2 grid"><div><label>سعر الشراء</label><input id="pco" type="number" min="0" step=".01"></div><div><label>سعر البيع</label><input id="ps" type="number" min=".01" step=".01"></div></div><div><label>قطع الكرتونة (1 إذا لم توجد)</label><input id="pp" type="number" min="1" value="1"></div><button class="btn green full" onclick="createProduct()">إنشاء الصنف وربطه بنبتة</button></div></div>`)}
function expiryView(){view(`<div class="card"><div class="title">تسجيل صلاحية منتج</div><p class="sub">تسجل الصلاحية دون زيادة أو خصم في المخزون.</p><div class="row"><input id="eq" class="grow" placeholder="اسم المنتج أو باركوده"><button class="btn primary" onclick="searchExpiry()">بحث</button><button class="btn muted" onclick="scanSearch('eq','expiryResults')">▥</button></div><div id="expiryResults"></div></div>${S.selectedExpiry?`<div class="card"><div class="title">${esc(S.selectedExpiry.nameAr)}</div><div class="grid g2"><div><label>الكمية بالقطع</label><input id="exQty" type="number" min="1" value="1"></div><div><label>تاريخ الصلاحية</label><input id="exDate" type="date"></div></div><button class="btn green full" style="margin-top:9px" onclick="saveExpiry()">حفظ الصلاحية</button></div>`:''}`)}
function reportsView(){const today=new Date().toISOString().slice(0,10),r=S.report;view(`<div class="card"><div class="title">تقارير نبتة</div><div class="g2 grid"><div><label>من</label><input id="rf" type="date" value="${today}"></div><div><label>إلى</label><input id="rt" type="date" value="${today}"></div></div><button class="btn primary full" style="margin-top:9px" onclick="loadReport()">عرض التقرير</button></div>${r?`<div class="grid g2"><div class="metric"><small>صافي المبيعات</small><b>${money(r.netSalesMinor)}</b></div><div class="metric"><small>الربح التقديري</small><b>${money(r.estimatedNetProfitMinor)}</b></div><div class="metric"><small>الخصومات</small><b>${money(r.discountsMinor)}</b></div><div class="metric"><small>المصروفات</small><b>${money(r.expensesMinor)}</b></div></div><div class="card"><div class="title">المخزون</div><div class="sub">قيمة البضاعة: ${money(r.stock?.inventoryValueMinor)} • أصناف قرب النفاد: ${r.stock?.lowCount||0} • عدد الفواتير: ${r.invoiceCount||0}</div></div>`:'<div class="empty">اختر الفترة لعرض المبيعات والربح والمصروفات.</div>'}`)}
function customersView(){view(`<div class="card"><div class="title">ديون العملاء والسداد</div><button class="btn primary full" onclick="loadCustomers()">تحديث العملاء</button></div><div class="card">${S.customers.length?S.customers.map(c=>`<div class="line"><div class="row between"><div><b>${esc(c.name)}</b><div class="sub">${esc(c.phone||'بدون هاتف')} • المتبقي ${money(c.balanceMinor)}</div></div><button class="btn green" onclick="collectCustomer('${c.id}','${esc(c.name)}')">سداد</button></div></div>`).join(''):'<div class="empty">اضغط تحديث لعرض الديون من نبتة</div>'}</div>`)}
function expenseView(){view(`<div class="card"><div class="title">مصروف أو استهلاك محل</div><div class="sub">${S.shift?.id?'سيسجل داخل الوردية المفتوحة':'افتح وردية على نبتة الرئيسي أولًا'}</div><div class="grid" style="margin-top:9px"><div><label>المبلغ بالجنيه</label><input id="ea" type="number" min=".01" step=".01"></div><div><label>السبب</label><input id="er" placeholder="مثال: نظافة أو نقل"></div><div><label>التصنيف</label><input id="ec" value="مصروفات تشغيل عامة"></div><button class="btn green full" onclick="postExpense()">حفظ المصروف</button></div></div>`)}
function settingsView(){view(`<div class="card"><div class="title">حساب نبتة</div><div class="sub">${S.session?`مسجل باسم ${esc(S.session.displayName)} • ${esc(S.session.terminalId)}`:'غير مسجل'}</div><hr class="hr"><div class="grid g2"><button class="btn outline" onclick="go('reports')">📊 التقارير</button><button class="btn outline" onclick="go('customers')">💳 الديون والسداد</button><button class="btn outline" onclick="go('expense')">💰 المصروفات</button><button class="btn outline" onclick="go('sale')">🧾 الفواتير والبيع</button></div><button class="btn danger full" style="margin-top:9px" onclick="logout()">تسجيل الخروج من هذا الهاتف</button></div><div class="card"><div class="title">النسخ الاحتياطي والطباعة</div><div class="sub">النسخ والاستعادة تُنفذ من نبتة Windows فقط لحماية ملف قاعدة البيانات المحلي. طباعة أي فاتورة تتم على طابعة الإيصالات المتصلة بجهاز نبتة الرئيسي.</div></div><div class="card"><div class="title">الحماية والتكامل</div><div class="sub">رمز الدخول محفوظ مشفرًا في Android، والـHTML لا يصل إلى Token أو مفاتيح Cloudflare.</div></div>`)}
async function login(){try{busy(true);const d=await native('login',val('url'),val('terminal'),val('user'),val('pass'));S.session=d;S.screen='home';flash('تم تسجيل الدخول بنجاح')}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function loadSuppliers(){try{S.suppliers=await native('suppliers');render()}catch(e){flash(e.message,'warn')}}
async function newSupplier(){const n=prompt('اسم المورد');if(!n)return;const p=prompt('رقم الهاتف (اختياري)')||'';try{const x=await native('createSupplier',n,p);S.suppliers.push(x);S.supplier=x.name;flash('تمت إضافة المورد')}catch(e){flash(e.message,'err')}}
async function searchProducts(input='q',output='results'){const q=val(input).trim();if(!q)return;try{busy(true);const d=await native('search',q);S.products=d.products||[];const box=document.getElementById(output);box.innerHTML=S.products.length?S.products.map((p,i)=>`<div class="line"><div class="row between"><div><b>${esc(p.nameAr)}</b><div class="sub">${esc(p.barcodes?.[0]||'بدون باركود')} • المتاح: ${(p.availableQtyMilli||0)/1000}</div></div><button class="btn green" onclick="addProduct(${i})">+ إضافة</button></div></div>`).join(''):'<div class="empty">لا توجد نتائج؛ أضفه من شاشة الأصناف.</div>'}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function scanSearch(target='q',output='results'){try{const d=await native('scan');const el=document.getElementById(target);if(el)el.value=d.barcode;await searchProducts(target,output)}catch(e){flash(e.message,'err')}}
async function scanForReceive(){try{busy(true);const d=await native('scan');const found=await native('search',d.barcode);S.products=found.products||[];const exact=S.products.find(p=>(p.barcodes||[]).includes(d.barcode)||(p.barcodeMappings||[]).some(x=>x.barcode===d.barcode));if(exact){const i=S.products.indexOf(exact);addProduct(i);flash(`تمت إضافة ${exact.nameAr}. اضغط «مسح التالي» للمتابعة`)}else{S.inlineNew=true;go('receive');flash('الباركود غير مسجل. أضف الصنف داخل الفاتورة؛ سيولد نبتة باركودًا عند تركه فارغًا.','warn')}}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function loadShift(){try{const d=await command('GET','/v1/shifts/current');S.shift=d.shift||null;render()}catch(e){S.shift=null;flash(e.message,'warn')}}
async function searchSale(){const q=val('sq').trim();if(!q)return;try{busy(true);const d=await native('search',q);S.products=d.products||[];const box=document.getElementById('saleResults');box.innerHTML=S.products.length?S.products.map((p,i)=>`<div class="line"><div class="row between"><div><b>${esc(p.nameAr)}</b><div class="sub">المتاح ${(p.availableQtyMilli||0)/1000} • ${money(p.priceMinor)}</div></div><button class="btn green" onclick="addSaleProduct(${i})">+ للسلة</button></div></div>`).join(''):'<div class="empty">لا توجد نتائج</div>'}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function scanForSale(){try{const d=await native('scan');const input=document.getElementById('sq');if(input)input.value=d.barcode;await searchSale()}catch(e){flash(e.message,'err')}}
function addSaleProduct(i){const p=S.products[i];if(!p)return;const found=S.saleLines.find(x=>x.product.id===p.id);if(found)found.qty++;else S.saleLines.push({product:p,qty:1});render()}
function saleTotal(){return S.saleLines.reduce((sum,l)=>sum+l.qty*l.product.priceMinor,0)}
function renderSaleTotal(){const target=document.getElementById('saleTotal');if(!target)return;const discount=Math.max(0,Math.round(Number(val('discount'))*100));target.textContent=`إجمالي البيع بعد الخصم: ${money(Math.max(0,saleTotal()-discount))}`}
async function postSale(){if(!S.shift?.id)return flash('افتح وردية من برنامج نبتة الرئيسي أولًا','err');const discount=Math.max(0,Math.round(Number(val('discount'))*100));const payment=val('payment');if(discount>saleTotal())return flash('الخصم أكبر من إجمالي الفاتورة','err');try{busy(true);const quote=await command('POST','/v1/quotes',{terminalId:S.session.terminalId,shiftId:S.shift.id,discountMinor:discount,lines:S.saleLines.map(x=>({productId:x.product.id,qtyMilli:x.qty*1000,saleUnit:'UNIT'}))});const sale=await command('POST','/v1/sales',{terminalId:S.session.terminalId,shiftId:S.shift.id,quoteId:quote.id,payments:[{method:payment,amountMinor:quote.totalMinor,tenderedMinor:payment==='CASH'?quote.totalMinor:undefined}]});S.saleLines=[];flash(`تم البيع ${String(sale.saleId||sale.id||'').slice(0,8)} وطباعة الإيصال من نبتة`);go('home')}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function loadReport(){const from=val('rf'),to=val('rt');if(!from||!to)return flash('اختر الفترة أولًا','err');try{busy(true);S.report=await command('GET',`/v1/reports/summary?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);render()}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function loadCustomers(){try{busy(true);S.customers=await command('GET','/v1/partners/customers');render()}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function collectCustomer(id,name){const raw=prompt(`قيمة السداد من ${name} بالجنيه`);if(raw===null)return;const amount=Math.round(Number(raw)*100);if(!(amount>0))return flash('أدخل مبلغًا صحيحًا','err');try{busy(true);await command('POST','/v1/partners/customer/collect',{idempotencyKey:crypto.randomUUID(),payment:{partnerId:id,amountMinor:amount,note:'سداد من تطبيق نبتة دكاني'}});flash('تم تسجيل السداد');loadCustomers()}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function postExpense(){if(!S.shift?.id)return flash('افتح وردية على نبتة الرئيسي أولًا','err');const amount=Math.round(Number(val('ea'))*100),reason=val('er').trim(),category=val('ec').trim();if(!(amount>0)||reason.length<3||category.length<2)return flash('أكمل مبلغ المصروف والسبب والتصنيف','err');try{busy(true);await command('POST',`/v1/shifts/${S.shift.id}/cash-movements`,{type:'EXPENSE',amountMinor:amount,reason,expenseCategory:category});flash('تم تسجيل المصروف في نبتة');go('settings')}catch(e){flash(e.message,'err')}finally{busy(false)}}
function addProduct(i){const p=S.products[i];if(!p)return;const found=S.lines.find(x=>x.product.id===p.id);if(found)found.qty++;else S.lines.push({product:p,qty:1,cost:p.wholesalePriceMinor||0,sell:p.priceMinor||0,carton:false,expiry:''});flash('تمت إضافة الصنف إلى الفاتورة');go('receive')}
function removeLine(i){S.lines.splice(i,1);render()} function editLine(i,k,v){const l=S.lines[i];if(k==='qty')l.qty=Math.max(0,Number(v)||0);else if(k==='cost'||k==='sell')l[k]=Math.round((Number(v)||0)*100);else if(k==='carton')l.carton=v==='true';else l[k]=v;render()}
function lineTotal(l){return l.carton?l.qty*l.cost:l.qty*l.cost} function total(){return S.lines.reduce((a,l)=>a+lineTotal(l),0)} function val(id){return document.getElementById(id)?.value||''}function busy(on){document.body.classList.toggle('loading',on)}
async function createProduct(){const name=val('pn').trim(),category=val('pc').trim(),price=Math.round(Number(val('ps'))*100),cost=Math.round(Number(val('pco'))*100),pack=Math.max(1,Number(val('pp'))||1);if(name.length<2||!category||!(price>0)||cost<0)return flash('راجع اسم الصنف والتصنيف والأسعار','err');const request={nameAr:name,category,description:'',unitKind:'PIECE',weightUnit:'KILOGRAM',priceMinor:price,wholesalePriceMinor:cost,openingQtyMilli:0,openingUnitCostMinor:cost,reorderLevelMilli:0,purchasePackSize:pack,unitBarcode:val('pb').trim()};try{busy(true);const d=await native('createProduct',JSON.stringify(request));flash(`تم إنشاء الصنف. باركود القطعة: ${d.barcode}`);S.products=[];go('products')}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function createInlineProduct(){const name=val('ipn').trim(),category=val('ipc').trim(),price=Math.round(Number(val('ips'))*100),cost=Math.round(Number(val('ipco'))*100),pack=Math.max(1,Number(val('ipp'))||1),unit=val('ipu');if(name.length<2||!category||!(price>0)||cost<0)return flash('راجع اسم الصنف والتصنيف والأسعار','err');const request={nameAr:name,category,description:'',unitKind:unit,weightUnit:'KILOGRAM',priceMinor:price,wholesalePriceMinor:cost,openingQtyMilli:0,openingUnitCostMinor:cost,reorderLevelMilli:0,purchasePackSize:pack,unitBarcode:val('ipb').trim(),packageBarcode:val('ipkb').trim(),cartonBarcode:val('ipcb').trim()};try{busy(true);const made=await native('createProduct',JSON.stringify(request));const found=await native('search',name);S.products=found.products||[];const product=S.products.find(p=>p.id===made.id);if(!product)throw new Error('تم إنشاء الصنف ولكن تعذر تحميله للفاتورة؛ ابحث عنه بالاسم وأضفه');S.inlineNew=false;S.pendingBarcode='';const i=S.products.indexOf(product);addProduct(i);flash(`تم إنشاء الصنف وإضافته. باركود القطعة: ${made.barcode}`)}catch(e){flash(e.message,'err')}finally{busy(false)}}
function confirmReceipt(){if(S.supplier.trim().length<2)return flash('اكتب اسم المورد أولًا','err');if(!S.lines.length||S.lines.some(x=>x.qty<1||x.cost<0||x.sell<1))return flash('راجع الكمية والأسعار في كل الأصناف','err');if(!confirm(`سيتم اعتماد ${S.lines.length} صنف بإجمالي ${money(total())}، وإرسال أمر طباعة واحد إلى جهاز نبتة الرئيسي. متابعة؟`))return;postReceipt()}
async function postReceipt(){const warehouseId=S.lines[0]?.product.warehouseId;if(!warehouseId)return flash('حدّث بيانات الصنف ثم أعد المحاولة','err');const lines=S.lines.map(l=>{const carton=l.carton&&l.product.purchasePackSize>1;const qty=carton?l.qty*l.product.purchasePackSize*1000:l.qty*1000;const out={productId:l.product.id,qtyMilli:qty,retailPriceMinor:l.sell,entryUnit:carton?'CARTON':'PIECE',costBasis:carton?'PACKAGE':'UNIT'};if(l.expiry)out.expiresOn=l.expiry;if(carton){out.packageCount=l.qty;out.unitsPerPackage=l.product.purchasePackSize;out.packageCostMinor=l.cost;out.unitCostMinor=Math.floor(l.cost/l.product.purchasePackSize);out.wholesalePriceMinor=out.unitCostMinor}else{out.unitCostMinor=l.cost;out.wholesalePriceMinor=l.cost}return out});try{busy(true);const d=await native('postPurchaseReceipt',JSON.stringify({warehouseId,supplierName:S.supplier.trim(),supplierInvoiceNo:S.invoiceNo.trim()||undefined,supplyExpensesMinor:0,lines}));S.lines=[];S.invoiceNo='';flash(`تم اعتماد الاستلام ${d.receiptId.slice(0,8)} وإرسال أمر الطباعة`);go('home')}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function searchExpiry(){await searchProducts('eq','expiryResults');const box=document.getElementById('expiryResults');if(!box)return;box.innerHTML=S.products.map((p,i)=>`<div class="line"><div class="row between"><div><b>${esc(p.nameAr)}</b><div class="sub">${esc(p.barcodes?.[0]||'')}</div></div><button class="btn green" onclick="chooseExpiry(${i})">اختيار</button></div></div>`).join('')||'<div class="empty">لا توجد نتائج</div>'}function chooseExpiry(i){S.selectedExpiry=S.products[i];render()}
async function saveExpiry(){const q=Number(val('exQty')),date=val('exDate');if(!(q>0)||!date)return flash('أدخل الكمية وتاريخ الصلاحية','err');try{busy(true);await native('registerExpiry',S.selectedExpiry.id,Math.round(q*1000),date);flash('تم تسجيل الصلاحية دون تغيير الرصيد');S.selectedExpiry=null;go('expiry')}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function logout(){try{await native('logout');S.session=null;S.lines=[];S.products=[];flash('تم تسجيل الخروج');render()}catch(e){flash(e.message,'err')}}function openNav(){flash('استخدم شريط التنقل السفلي للوصول السريع','warn')}

/* واجهة متجر خاصة بنبتة: أيقونات SVG أصلية، وليست نسخًا من ملفات تطبيق آخر. */
function appIcon(kind){const paths={sale:'<path d="M3 4h2l2 11h10l3-8H8"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',receive:'<path d="M3 7h18v13H3z"/><path d="M3 7l3-4h12l3 4M8 12h8"/>',stock:'<path d="M4 7 12 3l8 4v11l-8 4-8-4z"/><path d="m4 7 8 4 8-4M12 11v11"/>',expiry:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',debt:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',expense:'<path d="M12 3v18M16 7.5c-.5-1.4-1.9-2.3-4-2.3-2.4 0-4 1.2-4 3 0 4.4 8 2 8 6.3 0 1.8-1.6 3-4 3-2.1 0-3.6-.9-4.2-2.4"/>',report:'<path d="M4 20V4M4 20h17"/><path d="M8 16v-5M13 16V7M18 16v-9"/>',scan:'<path d="M5 4H3v4M19 4h2v4M5 20H3v-4M19 20h2v-4"/><path d="M7 9v6M10 9v6M13 9v6M16 9v6"/>',invoice:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[kind]||paths.stock}</svg>`}
function homeTile(screen,icon,title,sub){return `<button class="shortcut" onclick="go('${screen}')"><div class="shortcut-icon">${appIcon(icon)}</div><b>${title}</b><div class="sub">${sub}</div></button>`}

async function postSale(){if(!S.shift?.id)return flash('افتح وردية من برنامج نبتة الرئيسي أولًا','err');const discount=Math.max(0,Math.round(Number(val('discount'))*100)),payment=S.salePayment||'CASH',customerId=payment==='CREDIT'?val('saleCustomer'):'';if(discount>saleTotal())return flash('الخصم أكبر من إجمالي الفاتورة','err');if(payment==='CREDIT'&&!customerId)return flash('اختر العميل قبل تسجيل البيع الآجل','err');try{busy(true);const quote=await command('POST','/v1/quotes',{terminalId:S.session.terminalId,shiftId:S.shift.id,discountMinor:discount,lines:S.saleLines.map(x=>({productId:x.product.id,qtyMilli:x.qty*1000,saleUnit:'UNIT'}))});const sale=await command('POST','/v1/sales',{terminalId:S.session.terminalId,shiftId:S.shift.id,quoteId:quote.id,printOnPrimary:S.printSale!==false,...(customerId?{customerId}:{}),payments:[{method:payment,amountMinor:quote.totalMinor,tenderedMinor:payment==='CASH'?quote.totalMinor:undefined}]});S.saleLines=[];S.saleCustomerId='';flash(`تم البيع ${String(sale.invoiceNo||sale.saleId||'').slice(0,16)} بنجاح${S.printSale!==false?'؛ أُرسل أمر طباعة واحد إلى نبتة Windows.':''}`);go('home')}catch(e){flash(e.message,'err')}finally{busy(false)}}

function productDetailView(){const p=S.productDetail;if(!p)return go('products');const pkg=p.retailPackage||{};const cartonBarcode=(p.barcodeMappings||[]).find(x=>x.saleUnit==='CARTON')?.barcode||'';const packageBarcode=(p.barcodeMappings||[]).find(x=>x.saleUnit==='PACKAGE')?.barcode||'';const isPiece=p.unitKind==='PIECE';view(`<div class="card"><button class="btn outline" onclick="go('products')">← رجوع للمخزون</button><div class="title" style="margin-top:10px">${esc(p.nameAr)}</div><div class="sub">${esc(p.description||'لا يوجد وصف')} • ${esc(p.category)} • ${isPiece?'قطعة':'وزن'} • الرصيد ${p.availableQtyMilli/1000}</div><div class="chips">${(p.barcodes||[]).map(b=>`<span class="chip">${esc(b)}</span>`).join('')||'<span class="chip">بدون باركود</span>'}</div></div><div class="card"><div class="title">تعديل الصنف</div><div class="grid"><div class="g2 grid"><div><label>اسم الصنف</label><input id="edName" value="${esc(p.nameAr)}"></div><div><label>التصنيف</label><input id="edCat" value="${esc(p.category)}"></div></div><div><label>الوصف</label><input id="edDesc" value="${esc(p.description||'')}"></div><div class="g2 grid"><div><label>سعر البيع</label><input id="edPrice" type="number" min="0" step=".01" value="${(p.priceMinor/100).toFixed(2)}"></div><div><label>سعر الجملة</label><input id="edCost" type="number" min="0" step=".01" value="${((p.wholesalePriceMinor||0)/100).toFixed(2)}"></div></div><div><label>${isPiece?'الرصيد بالقطعة':'الرصيد بالوحدة'}</label><input id="edQty" type="number" min="0" step=".001" value="${p.availableQtyMilli/1000}"></div>${isPiece?`<div class="line"><b>تحويل وتغليف الكرتونة / العبوة</b><div class="g2 grid" style="margin-top:7px"><div><label>قطع الكرتونة</label><input id="edCartonSize" type="number" min="1" value="${p.purchasePackSize||1}"></div><div><label>سعر بيع الكرتونة</label><input id="edCartonPrice" type="number" min="0" step=".01" value="${p.cartonPriceMinor?(p.cartonPriceMinor/100).toFixed(2):''}"></div><div><label>باركود الكرتونة async function generateEditorBarcode(){try{const generated=await command('POST','/v1/product-barcodes/generate',{});const target=['edCartonBarcode','edPackageBarcode'].map(id=>document.getElementById(id)).find(x=>x&&!x.value);if(!target)return flash('اكتب أو امسح أحد باركودي الكرتونة أو العبوة أولًا','warn');target.value=generated.barcode;flash('تم توليد باركود فريد')}catch(e){flash(e.message,'err')}}
async function saveProductEdit(){const p=S.productDetail,isPiece=p?.unitKind==='PIECE';if(!p)return;const pack=Math.max(1,Number(val('edCartonSize'))||1),cartonPrice=Math.round(Number(val('edCartonPrice'))*100),packageSize=Math.max(0,Number(val('edPackageSize'))||0),packagePrice=Math.round(Number(val('edPackagePrice'))*100);const mappings=[];if(isPiece&&packageSize>=2&&val('edPackageBarcode').trim())mappings.push({barcode:val('edPackageBarcode').trim(),saleUnit:'PACKAGE'});if(isPiece&&pack>=2&&cartonPrice>0&&val('edCartonBarcode').trim())mappings.push({barcode:val('edCartonBarcode').trim(),saleUnit:'CARTON'});const payload={nameAr:val('edName').trim(),category:val('edCat').trim(),description:val('edDesc').trim(),priceMinor:Math.round(Number(val('edPrice'))*100),wholesalePriceMinor:Math.round(Number(val('edCost'))*100),purchasePackSize:isPiece?pack:p.purchasePackSize,retailPackage:isPiece?(packageSize>=2&&packagePrice>0?{unitsPerPackage:packageSize,packagePriceMinor:packagePrice,contentsUnit:val('edPackageUnit'),label:'PACKAGE'}:null):null,cartonPriceMinor:isPiece?(cartonPrice>0?cartonPrice:null):null,cartonContentsUnit:isPiece?(cartonPrice>0?val('edCartonUnit'):null):null,barcodeMappings:mappings,mergeLegacyProducts:true,availableQtyMilli:Math.round(Math.max(0,Number(val('edQty'))||0)*1000),expectedStockVersion:p.version};if(payload.nameAr.length<2||!payload.category||payload.priceMinor<0)return flash('راجع الاسم والتصنيف وسعر البيع','err');try{busy(true);const updated=await command('PUT',`/v1/products/${p.id}`,payload);const found=await native('search',payload.nameAr);S.products=found.products||[];S.productDetail=S.products.find(x=>x.id===p.id)||null;flash(updated.mergedQtyMilli?'تم الحفظ وضم الرصيد القديم بأمان':'تم حفظ بطاقة الصنف');go('products')}catch(e){flash(e.message,'err')}finally{busy(false)}}
function weightView(){const p=S.productDetail&&S.productDetail.unitKind==='WEIGHT'?S.productDetail:null;view(`<div class="card"><button class="btn outline" onclick="go('products')">← رجوع</button><div class="title" style="margin-top:10px">حاسبة الوزن وملصق السعر</div><div class="sub">ابحث عن صنف وزن، أدخل الكمية، ثم يُنشأ باركود فريد ويُرسل ملصق واحد لطابعة الملصقات على نبتة Windows.</div><div class="row" style="margin-top:9px"><input id="wq" class="grow" placeholder="اسم صنف الوزن"><button class="btn primary" onclick="searchWeightProduct()">بحث</button></div></div>${p?`<div class="card"><div class="title">${esc(p.nameAr)}</div><div class="sub">سعر الوحدة: ${money(p.priceMinor)} • ${p.weightUnit==='KILOGRAM'?'كجم':p.weightUnit==='LITER'?'لتر':'وحدة مصغرة'}</div><div class="g2 grid" style="margin-top:9px"><div><label>الوزن / الكمية</label><input id="weightQty" type="number" min=".001" step=".001" oninput="previewWeightTotal()"></div><div><label>الإجمالي المتوقع</label><input id="weightTotal" readonly></div></div><button class="btn green full" style="margin-top:9px" onclick="createWeightLabel()">إنشاء وطباعة ملصق الوزن</button></div>`:'<div class="empty">ابحث واختر صنفًا مسجلًا للبيع بالوزن.</div>'}`)}
async function searchWeightProduct(){const q=val('wq').trim();if(!q)return;try{busy(true);const d=await native('search',q);S.products=(d.products||[]).filter(x=>x.unitKind==='WEIGHT').sort((a,b)=>((b.availableQtyMilli>0)-(a.availableQtyMilli>0)));if(!S.products.length)return flash('لا توجد أصناف وزن مطابقة','warn');S.productDetail=S.products[0];render();flash('تم اختيار أول صنف وزن متاح')}catch(e){flash(e.message,'err')}finally{busy(false)}}
function previewWeightTotal(){const p=S.productDetail,q=Number(val('weightQty'))||0;const target=document.getElementById('weightTotal');if(p&&target)target.value=(Math.round(q*p.priceMinor)/100).toFixed(2)+' ج'}
async function createWeightLabel(){const p=S.productDetail,q=Number(val('weightQty'));if(!p||p.unitKind!=='WEIGHT'||!(q>0))return flash('اختر صنف وزن وأدخل كمية صحيحة','err');try{busy(true);const created=await command('POST','/v1/weighted-labels',{productId:p.id,mode:'QUANTITY',qtyMilli:Math.round(q*1000),printOnPrimary:true});flash(`تم إنشاء الملصق ${created.label.barcode} وإرساله لطابعة الملصقات`)}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function productForBarcode(barcode){const result=await native('search',barcode);const products=result.products||[];return products.find(p=>(p.barcodes||[]).includes(barcode)||(p.barcodeMappings||[]).some(m=>m.barcode===barcode))||null}
async function scanForReceive(){try{const d=await native('scan');const product=await productForBarcode(d.barcode);if(product){addReceiptProductDirect(product);S.pendingBarcode='';go('receive');flash(`تمت إضافة ${product.nameAr}`)}else{S.pendingBarcode=d.barcode;S.inlineNew=true;go('receive');flash('الباركود غير مسجل؛ أكمل بيانات الصنف داخل الفاتورة أو اتركه ليولده نبتة تلقائيًا.','warn')}}catch(e){if(e.message!=='تم إيقاف المسح')flash(e.message,'err')}}
async function scanForSale(){try{const d=await native('scan');const product=await productForBarcode(d.barcode);if(!product)return flash('الباركود غير مسجل للبيع. أضف الصنف من الاستلام أو صفحة الأصناف أولًا.','warn');addSaleProductDirect(product);go('sale');flash(`تمت إضافة ${product.nameAr} للسلة`)}catch(e){if(e.message!=='تم إيقاف المسح')flash(e.message,'err')}}
async function scanBatch(target){if(S.scanActive)return;S.scanActive=true;let added=0;try{while(S.scanActive){let scan;try{scan=await native('scan')}catch(e){if(e.message!=='تم إيقاف المسح')throw e;break}const product=await productForBarcode(scan.barcode);if(!product){if(target==='receive'){S.pendingBarcode=scan.barcode;S.inlineNew=true;flash('الباركود غير مسجل؛ أوقفنا المسح لتسجيل الصنف داخل الفاتورة.','warn')}else flash('باركود غير مسجل للبيع؛ أوقفنا المسح.','warn');break}if(target==='receive')addReceiptProductDirect(product);else addSaleProductDirect(product);added++}}catch(e){flash(e.message,'err')}finally{S.scanActive=false;go(target==='receive'?'receive':'sale');if(added)flash(`تمت إضافة ${added} صنفًا بالمسح المتتابع`)}}
function stocktakeView(){const r=S.stocktake;view(`<div class="card"><div class="title">الجرد والتنبيه الذكي</div><div class="sub">قراءة مباشرة من نبتة: قيمة المخزون، أصناف إعادة الطلب وحركة الفترة. لا يُعدل هذا التقرير أي رصيد.</div><div class="g2 grid" style="margin-top:9px"><div><label>الفترة</label><select id="stockPeriod"><option value="MONTH">هذا الشهر</option><option value="QUARTER">هذا الربع</option><option value="YEAR">هذه السنة</option></select></div><div><label>حتى تاريخ</label><input id="stockDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><button class="btn primary full" style="margin-top:9px" onclick="loadStocktake(true)">تحديث الجرد</button></div>${!r?'<div class="empty">جار تحميل بيانات الجرد…</div>':`<div class="grid g2"><div class="metric"><small>قيمة المخزون</small><b>${money(r.totals?.inventoryValueMinor||0)}</b></div><div class="metric"><small>أصناف إعادة الطلب</small><b>${r.reorderItems?.length||0}</b></div></div><div class="card"><div class="title">تنبيهات النقص</div>${(r.reorderItems||[]).slice(0,50).map(x=>`<div class="line"><b>${esc(x.nameAr)}</b><div class="sub">المتاح: ${(x.availableQtyMilli||0)/1000} • حد الطلب: ${(x.reorderLevelMilli||0)/1000}</div></div>`).join('')||'<div class="empty">لا توجد أصناف تحت حد الطلب</div>'}</div><div class="card"><div class="title">حركة الفترة</div>${(r.salesItems||[]).slice(0,50).map(x=>`<div class="line row between"><div><b>${esc(x.nameAr)}</b><div class="sub">مباع: ${(x.qtyMilli||0)/1000}</div></div><b>${money(x.netMinor||0)}</b></div>`).join('')||'<div class="empty">لا توجد مبيعات في الفترة</div>'}<div class="sub" style="margin-top:10px">تصدير Excel الاحترافي يبقى من برنامج نبتة Windows لضمان ملف واحد موثق من قاعدة البيانات.</div></div>`}`)}
async function loadStocktake(fromButton=false){try{if(fromButton)busy(true);const period=val('stockPeriod')||'MONTH',referenceDate=val('stockDate');const query=new URLSearchParams({period});if(referenceDate)query.set('referenceDate',referenceDate);S.stocktake=await command('GET',`/v1/inventory/periodic-report?${query.toString()}`);if(S.screen==='stocktake')render()}catch(e){flash(e.message,'err')}finally{busy(false)}}
function invoicesView(){view(`<div class="card"><div class="title">فواتير البيع والمرتجعات</div><div class="row"><input id="iq" class="grow" placeholder="رقم الفاتورة أو اسم العميل أو الصنف"><button class="btn primary" onclick="loadInvoices()">بحث</button></div><div class="sub" style="margin-top:8px">يُسجل المرتجع كحركة عكسية داخل نبته ولا يحذف الفاتورة الأصلية.</div></div><div class="card">${S.invoices.length?S.invoices.map(x=>`<div class="line"><div class="row between"><div><b>${esc(x.invoiceNo)}</b><div class="sub">${esc(x.partyName)} • ${new Date(x.postedAt).toLocaleDateString('ar-EG')} • ${x.itemCount} صنف</div></div><b>${money(x.totalMinor)}</b></div><button class="btn outline full" style="margin-top:8px" onclick="openSaleForReturn('${esc(x.invoiceNo)}')">عرض / مرتجع</button></div>`).join(''):'<div class="empty">ابحث لاسترجاع الفواتير السابقة.</div>'}</div>${S.selectedSale?`<div class="card"><div class="title">${esc(S.selectedSale.invoice_no)}</div>${S.selectedSale.lines.map(l=>{const remaining=Math.max(0,l.qtyMilli-(l.returnedQtyMilli||0));return `<div class="line"><b>${esc(l.nameAr)}</b><div class="sub">المتبقي للمرتجع: ${remaining/1000}</div>${remaining?`<button class="btn green full" style="margin-top:8px" onclick="returnSaleLine('${esc(S.selectedSale.sale_id)}','${esc(l.id)}',${remaining})">تسجيل مرتجع</button>`:'<div class="sub">تم إرجاع كامل الكمية</div>'}</div>`}).join('')}</div>`:''}`)}
async function loadInvoices(){const q=val('iq').trim();try{busy(true);const params=new URLSearchParams({kind:'SALE',limit:'50'});if(q)params.set('query',q);const data=await command('GET',`/v1/invoices?${params.toString()}`);S.invoices=data.items||[];S.selectedSale=null;render()}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function openSaleForReturn(invoiceNo){try{busy(true);S.selectedSale=await command('GET',`/v1/sales/lookup?invoiceNo=${encodeURIComponent(invoiceNo)}`);render()}catch(e){flash(e.message,'err')}finally{busy(false)}}
async function returnSaleLine(saleId,lineId,maxQtyMilli){if(!S.shift?.id){await loadShift();if(!S.shift?.id)return flash('افتح وردية قبل تنفيذ المرتجع','err')}const raw=prompt(`الكمية المرتجعة (حتى ${maxQtyMilli/1000})`);if(raw===null)return;const qtyMilli=Math.round(Number(raw)*1000);if(!(qtyMilli>0)||qtyMilli>maxQtyMilli)return flash('كمية المرتجع غير صحيحة','err');const reason=prompt('سبب المرتجع')||'';if(reason.trim().length<3)return flash('اكتب سبب المرتجع','err');const condition=confirm('اضغط موافق لإعادة الصنف للمخزون، وإلغاء لتسجيله تالفًا')?'RESTOCK':'DAMAGED';try{busy(true);await command('POST',`/v1/sales/${saleId}/returns`,{shiftId:S.shift.id,lines:[{saleLineId:lineId,qtyMilli,condition}],reason:reason.trim()});flash('تم تسجيل المرتجع وتحديث المخزون والحسابات');await openSaleForReturn(S.selectedSale.invoice_no)}catch(e){flash(e.message,'err')}finally{busy(false)}}
(async()=>{try{const d=await native('initialState');if(d.loggedIn){S.session=d;S.screen='home'}render()}catch(e){flash('تعذر تشغيل التطبيق','err');loginView()}})();
</script><link rel="stylesheet" href="ui-v13.css"><script src="receive-v12.js"></script><script src="ui-v13.js"></script><script src="receive-v14.js"></script></body></html>
