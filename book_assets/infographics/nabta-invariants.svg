<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title"><title id="title">ثوابت نبتة المالية</title><rect width="1000" height="360" rx="24" fill="#167360"/><g fill="#fff" font-family="Tahoma,Arial" text-anchor="middle"><text x="500" y="60" font-size="30">ثوابت لا تتغير</text><g font-size="22"><circle cx="175" cy="180" r="78" fill="#e3f1ed"/><text x="175" y="172" fill="#123c36">قرش صحيح</text><text x="175" y="202" fill="#123c36">لا float</text><circle cx="390" cy="180" r="78" fill="#e3f1ed"/><text x="390" y="172" fill="#123c36">قفل صف</text><text x="390" y="202" fill="#123c36">لا oversell</text><circle cx="610" cy="180" r="78" fill="#e3f1ed"/><text x="610" y="172" fill="#123c36">مفتاح واحد</text><text x="610" y="202" fill="#123c36">لا تكرار</text><circle cx="825" cy="180" r="78" fill="#e3f1ed"/><text x="825" y="172" fill="#123c36">دفتر دائم</text><text x="825" y="202" fill="#123c36">لا حذف</text></g></g></svg>
