
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18191e"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#800a1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="150" y1="120" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#800a1b" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Brand Emblem circle -->
  <circle cx="256" cy="256" r="190" fill="url(#accentGrad)" fill-opacity="0.35" stroke="#991b1b" stroke-width="4"/>

  <!-- Shopping Basket / Bag Illustration -->
  <g transform="translate(136, 130)">
    <!-- Basket Handle -->
    <path d="M 40 120 C 40 40, 200 40, 200 120" fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Basket Body -->
    <path d="M 15 120 L 40 225 C 43 238, 55 248, 68 248 L 172 248 C 185 248, 197 238, 200 225 L 225 120 Z" fill="#800a1b" stroke="#f87171" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Basket weave lines -->
    <line x1="45" y1="160" x2="195" y2="160" stroke="#fca5a5" stroke-width="5" stroke-opacity="0.6"/>
    <line x1="55" y1="198" x2="185" y2="198" stroke="#fca5a5" stroke-width="5" stroke-opacity="0.6"/>
    
    <!-- Fresh Leaf Motif (Market & Freshness) -->
    <path d="M 160 85 C 160 45, 120 40, 110 50 C 105 75, 120 95, 160 85 Z" fill="#34d399"/>
    <path d="M 110 50 Q 135 68 160 85" stroke="#065f46" stroke-width="3" fill="none"/>
    
    <!-- Sparkle Stars -->
    <circle cx="60" cy="80" r="8" fill="#fbbf24"/>
    <polygon points="210,80 214,88 222,90 214,94 210,102 206,94 198,90 206,88" fill="#fbbf24"/>
  </g>

  <!-- Typography: الشـيماء -->
  <text x="256" y="420" font-family="'Cairo', sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">ماركت الشيماء</text>
  <text x="256" y="455" font-family="'Cairo', sans-serif" font-size="20" font-weight="600" fill="#34d399" text-anchor="middle">سوبر ماركت &amp; بقالة طازجة</text>
</svg>
